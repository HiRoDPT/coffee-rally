<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コーヒー飲み比べラリー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-width column; three tabs (participant card / vendor application / organizer) over a shared store */
:root{
  --bg:#f2efeb; --paper:#ffffff; --ink:#2a201b; --muted:#6e625a; --line:#ddd5cd;
  --roast:#5b3a28; --leaf:#2e6b5a; --stamp:#9a3a1c; --soft:#e9e3dc;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18130f; --paper:#221b16; --ink:#efe7df; --muted:#a8998d; --line:#3a2f27;
  --roast:#d9a984; --leaf:#7cc4ad; --stamp:#ff8a62; --soft:#2d241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18130f; --paper:#221b16; --ink:#efe7df; --muted:#a8998d; --line:#3a2f27;
  --roast:#d9a984; --leaf:#7cc4ad; --stamp:#ff8a62; --soft:#2d241e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.tabs button{font:700 13px var(--body);border:0;border-radius:999px;padding:10px 4px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--roast);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tabs button[hidden]{display:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.file:focus-within{outline:3px solid var(--leaf);outline-offset:2px}
.note{font-size:13px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--leaf)}
.head h2{font-size:24px;font-weight:900;color:var(--roast)}
.head p{margin:0;color:var(--muted);font-size:14px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--roast);border-radius:99px;transition:width .4s}
.cups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cups.five{grid-template-columns:repeat(6,minmax(0,1fr))}
.cups.five>*{grid-column:span 2}
.cups.five>*:nth-child(4){grid-column:2/span 2}
.slot{position:relative;border:2px dashed var(--line);border-radius:18px;background:var(--bg);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:inherit;text-align:center;min-width:0}
.slot.empty{opacity:.8}
.ph{width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--muted)}
.slot b{font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.slot small{font-size:11px;color:var(--muted)}
.slot.got{border-style:solid;border-color:var(--stamp)}
.ph.logo{border:2px solid var(--line);background:#fff}
.ph.todo{border:2px dashed var(--line);background:transparent;font-size:22px}
.done-badge{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;background:var(--stamp);color:#fff;display:grid;place-items:center;font:900 13px var(--display);transform:rotate(-14deg)}
@media (prefers-reduced-motion:no-preference){.ph.logo.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}}
@keyframes pop{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
.arrive{text-align:center;align-items:center}
.arrive .big{width:min(220px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;object-fit:cover;border:5px solid var(--stamp);background:#fff}
@media (prefers-reduced-motion:no-preference){.arrive .big{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qr{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.qr img,.qr canvas{width:100%;max-width:150px;height:auto;background:#fff;padding:6px;border-radius:8px}
.qr .t{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.scanner{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#fff;text-align:center}
.scanner .frame{position:relative;width:min(86vw,420px);aspect-ratio:1;border-radius:20px;overflow:hidden;background:#000}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scanner .frame::after{content:"";position:absolute;inset:14%;border:3px solid rgba(255,255,255,.85);border-radius:16px}
.scanner .msg{color:#f3e9e0}
.scanner label.file{color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:10px 16px}
.stamp{position:absolute;left:8%;right:8%;top:6px;aspect-ratio:1;border:3px double var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;
  font:900 13px/1.2 var(--display);transform:rotate(-14deg);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:4px;text-align:center}
.stamp span{display:block;font:500 10px var(--body)}
@media (prefers-reduced-motion:no-preference){.stamp.new{animation:press .45s cubic-bezier(.2,1.6,.4,1)}}
@keyframes press{from{transform:rotate(-14deg) scale(1.8);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:26px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--roast);border-color:var(--roast);color:var(--paper)}
.name-in{font-weight:700}
.mini{color:var(--stamp);font-size:11px;letter-spacing:1px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--soft);color:var(--muted)}
.tag.ok{background:var(--leaf);color:var(--paper)}
.tag.demo{background:var(--stamp);color:#fff}
.sheet img.hero{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.sheet p{margin:0;white-space:pre-wrap}
dl.spec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:14px}
dl.spec dt{color:var(--muted);font-size:12px;font-weight:700;padding-top:2px}
dl.spec dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 160px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical;min-height:60px}
.btn{font:700 14px var(--body);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--roast);color:var(--paper)}
.btn.leaf{background:var(--leaf);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%;padding:13px}
.msg{font-size:13px;min-height:1.3em;margin:0;color:var(--muted)}
.msg.ok{color:var(--leaf);font-weight:700}
.msg.err{color:var(--stamp);font-weight:700}
.reward{border-radius:14px;padding:12px 16px;background:var(--soft);font-size:14px}
.reward.done{background:var(--roast);color:var(--paper)}
.reward strong{font-family:var(--display);display:block}
.cert{margin-top:14px;border:2px solid var(--stamp);border-radius:16px;padding:14px 16px}
.cert h3{font-family:var(--display);color:var(--roast);font-size:18px;margin:2px 0 4px}
.app{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start}
.app .ph{width:56px;font-size:10px}
.app .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.app .t{font-weight:700;overflow-wrap:anywhere}
.app .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
label.file{font-size:13px;color:var(--leaf);cursor:pointer;font-weight:700}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
.photo-btn{position:relative;color:var(--ink);font-weight:500}
.memo-photo{display:block;width:100%;max-width:100%;max-height:320px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin:4px 0 8px}
.preview{width:100%;max-width:100%;border-radius:14px;border:1px solid var(--line)}
.preview+.preview{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cups{gap:8px}.grid2{grid-template-columns:1fr}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button id="tab-play" role="tab" aria-selected="true">スタンプ台紙</button>
    <button id="tab-admin" role="tab" aria-selected="false" hidden>主催者</button>
  </div>
  <div class="panel" id="inapp" hidden style="border-color:var(--stamp)">
    <h3>スマホのブラウザで開いてください</h3>
    <p class="msg">いまはアプリの中の画面で開いています。このままだとスタンプが消えることがあります。画面の「︙」や共有ボタンから「ブラウザで開く」（iPhoneはSafari、AndroidはChrome）を選んでください。</p>
    <div class="row"><button class="btn" id="copy-link">リンクをコピー</button><span class="msg" id="copy-msg"></span></div>
  </div>
  <p class="note" id="mode-note" hidden></p>
  <section id="view-play" class="wrap"></section>
    <section id="view-admin" class="wrap" hidden></section>
  <div class="scanner" id="scanner" hidden role="dialog" aria-label="QRコードを読み込む">
    <h3>お店のQRコードを枠の中に写してください</h3>
    <div class="frame"><video id="scan-video" playsinline muted></video></div>
    <p class="msg" id="scan-msg">カメラの使用を許可してください。</p>
    <div class="row" style="justify-content:center">
      <label class="file">写真から読み込む<input id="scan-file" type="file" accept="image/*"></label>
      <button class="btn ghost" id="scan-close" style="color:#fff;border-color:rgba(255,255,255,.5)">閉じる</button>
    </div>
  </div>
</div>

<script src="qrcode.min.js"></script>
<script src="jsQR.js"></script>
<script>
// Standalone build: the page's own address is the QR target
const ARTIFACT_URL=location.origin+location.pathname;
// 5 shops = 飲み比べ達成; every listed shop = 全店制覇
const GOAL=5;
// How many shops the organizer may list
const SHOP_MAX=30;
const DEFAULT_CFG={title:"Coffee Festa まめかけ2026",date:"11/08(日) 10:00〜16:00",place:"東伯総合公園",approved:[]};
// Example shops shown only while no real vendor has been approved; clearly labelled 見本
const DEMO=[
  {id:"demo-1",shop:"見本：あさひ焙煎所",bean:"エチオピア イルガチェフェ",roast:"浅煎り",notes:"レモンや紅茶のような明るい酸味",message:"ハンドドリップで1杯ずつ淹れます。",code:"ASAHI",image:null},
  {id:"demo-2",shop:"見本：喫茶こもれび",bean:"ブラジル サントス",roast:"中煎り",notes:"ナッツとミルクチョコの甘さ",message:"はじめての方にも飲みやすい味です。",code:"KOMOREBI",image:null},
  {id:"demo-3",shop:"見本：KURO coffee",bean:"インドネシア マンデリン",roast:"深煎り",notes:"どっしりした苦味とスパイス感",message:"水出しアイスもあります。",code:"KURO",image:null},
  {id:"demo-4",shop:"見本：はなまめ珈琲",bean:"コスタリカ ハニー",roast:"中浅煎り",notes:"はちみつのような甘さと柔らかい酸",message:"豆の量り売りもしています。",code:"HANAMAME",image:null},
  {id:"demo-5",shop:"見本：みなと珈琲店",bean:"グアテマラ アンティグア",roast:"中深煎り",notes:"カカオとキャラメルの余韻",message:"カフェオレにも合う豆です。",code:"MINATO",image:null}
];
// Final shop list baked into the page for visitors who are not signed in (they cannot read the shared store)
const EMBEDDED=[
  {id:"e-KG",shop:"KG coffee",code:"KG",image:"logos/KG.jpg"},
  {id:"e-MILESTONE",shop:"MILESTONE COFFEE",code:"MILESTONE",image:"logos/MILESTONE.jpg"},
  {id:"e-MEET",shop:"MEET COFFEE",code:"MEET",image:"logos/MEET.jpg"},
  {id:"e-ARTHUR",shop:"Arthur coffee",code:"ARTHUR",image:"logos/ARTHUR.jpg"},
  {id:"e-ZEZE",shop:"是是珈琲",code:"ZEZE",image:"logos/ZEZE.jpg"},
  {id:"e-GUFO",shop:"GUFO COFFEE",code:"GUFO",image:"logos/GUFO.jpg"},
  {id:"e-BENINO",shop:"Benino COFFEE",code:"BENINO",image:"logos/BENINO.jpg"},
  {id:"e-COCOTTE",shop:"Cafe Cocotte",code:"COCOTTE",image:"logos/COCOTTE.jpg"},
  {id:"e-AROWANA",shop:"アロワナ珈琲",code:"AROWANA",image:"logos/AROWANA.jpg"},
  {id:"e-REST",shop:"Rest Coffee",code:"REST",image:"logos/REST.jpg"},
  {id:"e-MATAHARI",shop:"MATAHARI COFFEE",code:"MATAHARI",image:"logos/MATAHARI.jpg"},
  {id:"e-WAKU",shop:"ワク珈琲",code:"WAKU",image:"logos/WAKU.jpg"}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars=n=>"★".repeat(n||0)+"☆".repeat(5-(n||0));
// Stand-in logo for shops that have not supplied one yet (and for the 見本 shops)
const _logoCache={};
function genLogo(name){
  if(_logoCache[name])return _logoCache[name];
  const hues=["#5b3a28","#2e6b5a","#7a4b8c","#9a3a1c","#2f4a8a","#8a6d1f"];
  let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;
  const c=document.createElement("canvas");c.width=c.height=240;const g=c.getContext("2d");
  g.fillStyle=hues[h%hues.length];g.fillRect(0,0,240,240);
  g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=6;g.beginPath();g.arc(120,120,96,0,Math.PI*2);g.stroke();
  const label=name.replace(/^見本：/,"").replace(/(珈琲|コーヒー|coffee|焙煎所|喫茶|店)/gi,"").trim().slice(0,2)||name.slice(0,2);
  g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.font='900 72px "Zen Maru Gothic",sans-serif';g.fillText(label,120,112);
  g.font='700 18px "Noto Sans JP",sans-serif';g.fillText("COFFEE",120,170);
  return _logoCache[name]=c.toDataURL("image/png");
}
const logoOf=s=>s.image||genLogo(s.shop);
const stampURL=s=>`${ARTIFACT_URL}#q-${s.code}-${hexName(s.shop.replace(/^見本：/,""))}`;
const nowLabel=()=>{const d=new Date();return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`};

/* ---------- store (shared db when available, else this browser only) ---------- */
const S={cfg:{...DEFAULT_CFG},vendors:{},progress:{stamps:{}},uid:null,canEdit:false,remote:false};
let db=null, progressRef=null, chain=Promise.resolve();
const queue=fn=>(chain=chain.then(fn).catch(e=>flash("保存できませんでした（"+(e&&e.code||"error")+"）","err")));
const LKEY="coffee-rally-local-v1";
function lload(){try{const v=JSON.parse(localStorage.getItem(LKEY)||"null");if(v){S.cfg={...DEFAULT_CFG,...v.cfg};S.vendors=v.vendors||{};S.progress=v.progress||{stamps:{}}}}catch(e){}}
function lsave(){try{localStorage.setItem(LKEY,JSON.stringify({cfg:S.cfg,vendors:S.vendors,progress:S.progress}))}catch(e){}}
function saveCfg(c){S.cfg=c;if(!S.remote){lsave();return Promise.resolve()}return queue(()=>db.doc("config/event").set(c))}
function saveVendor(id,v){S.vendors[id]=v;if(!S.remote){lsave();return Promise.resolve()}return queue(()=>db.doc("vendors/"+id).set(v))}
function deleteVendor(id){delete S.vendors[id];if(!S.remote){lsave();return Promise.resolve()}return queue(()=>db.doc("vendors/"+id).delete())}
// Progress is always mirrored to this browser, and also to the viewer's account when the shared store accepts it
/* ---------- anonymous counts for the organizer (Google Sheets via Apps Script) ---------- */
// Web app URL from the organizer's spreadsheet; empty = nothing is sent
const TRACK_URL="https://script.google.com/macros/s/AKfycbwcYXRdicyepGhr72sy7ILozpN6RC0veAyRMZYeuPKgzM_nxwj-GnO1GRd4c8l7zpzrDQ/exec";
const AKEY="coffee-rally-anon", QKEY="coffee-rally-outbox", FKEY="coffee-rally-sent";
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function anonId(){let id=lsGet(AKEY,"");if(!id){id=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-6);lsSet(AKEY,id)}return id}
// once=true records the event a single time per phone (open, goal5, complete)
function track(type,s,once,extra){
  if(!TRACK_URL)return;
  const sent=lsGet(FKEY,{});if(once&&sent[type])return;
  if(once){sent[type]=1;lsSet(FKEY,sent)}
  const q=lsGet(QKEY,[]);q.push({id:anonId(),type,code:s?.code||"",shop:s?.shop||"",t:Date.now(),...(extra||{})});lsSet(QKEY,q.slice(-200));
  flush();
}
let flushing=false;
// Queued so scans made with no signal are sent once the phone is back online
async function flush(){
  if(!TRACK_URL||flushing||navigator.onLine===false)return;
  const q=lsGet(QKEY,[]);if(!q.length)return;
  flushing=true;
  try{await fetch(TRACK_URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify({events:q})});
    lsSet(QKEY,lsGet(QKEY,[]).slice(q.length))}
  catch(e){}
  flushing=false;
}
window.addEventListener("online",flush);
// The sheet keeps one note row per phone and shop, overwritten with the latest stars and memo
let noteTimer=null;
function trackNote(id,delay){
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>{const s=shops().all.find(x=>x.id===id), st=S.progress.stamps[id];if(!s||!st)return;
    track("note",s,false,{rating:st.rating||0,bean:st.bean||"",roast:st.roast||"",tastes:(st.tastes||[]).join("・"),memo:st.memo||""})},delay||0);
}
function trackMilestones(){const {list,all}=shops();if(list.length>=GOAL)track("goal5",null,true);if(all.length&&list.length>=all.length)track("complete",null,true)}

const PKEY="coffee-rally-progress-v1";
function psave(){try{localStorage.setItem(PKEY,JSON.stringify(S.progress));return true}catch(e){return false}}
function pload(){try{const v=JSON.parse(localStorage.getItem(PKEY)||"null");return v&&v.stamps?v:null}catch(e){return null}}
function saveProgress(){
  psave();
  if(!S.remote||!progressRef){lsave();return Promise.resolve()}
  const p=JSON.parse(JSON.stringify(S.progress));
  chain=chain.then(()=>progressRef.set(p)).then(()=>{if(!S.cloudOK){S.cloudOK=true;renderSaveNote()}})
    .catch(()=>{S.cloudOK=false;renderSaveNote()});
  return chain;
}
function mergeProgress(a,b){
  const out={...a,stamps:{...(b.stamps||{})},extra:{...(b.extra||{}),...(a.extra||{})}};
  for(const [k,v] of Object.entries(a.stamps||{})){const o=out.stamps[k];out.stamps[k]=o?{...v,...o,tastes:o.tastes?.length?o.tastes:v.tastes}:v}
  return out;
}
function renderSaveNote(){
  const el=$("#save-note");if(!el)return;

/* ---------- derived ---------- */
function shops(){
  const ap=(S.cfg.approved||[]).map(id=>S.vendors[id]&&{id,...S.vendors[id]}).filter(Boolean).slice(0,SHOP_MAX);
  const base=ap.length?ap:(S.remote?DEMO:EMBEDDED);
  // Shops known only from a QR's embedded name (not on the organizer's list)
  const extra=Object.entries(S.progress.extra||{}).map(([code,v])=>({id:"x-"+code,code,shop:v.shop}))
    .filter(x=>!base.some(b=>String(b.code||"").toUpperCase()===x.code));
  const all=[...base,...extra];
  // The card holds the shops this participant has stamped, in the order they were stamped
  const list=Object.keys(S.progress.stamps||{}).map(id=>all.find(x=>x.id===id)).filter(Boolean);
  return {all,list,demo:!ap.length&&S.remote};
}
const ROASTS=["浅煎り","中浅煎り","中煎り","中深煎り","深煎り"];
const TASTES=["酸味","苦味","甘み","コク","フルーティー","香ばしい","すっきり","華やか"];
const hexName=t=>Array.from(new TextEncoder().encode(t)).map(b=>b.toString(16).padStart(2,"0")).join("");
const unhexName=h=>{try{return new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x=>parseInt(x,16))))}catch(e){return ""}};
function stampedCount(list){return list.filter(s=>S.progress.stamps[s.id]).length}

$("#view-play").addEventListener("click",async e=>{
  const t=e.target;
  const o=t.closest("[data-open]");
  if(o){openId=o.dataset.open;renderSheet();$("#play-sheet").scrollIntoView({behavior:"smooth",block:"nearest"});return}
  if(t.id==="close"){openId=null;renderSheet();return}
  // Two taps so a stray tap doesn't wipe a stamp and its notes
  if(t.id==="unstamp"){
    if(!t.dataset.sure){t.dataset.sure="1";t.textContent="もう一度押すと取り消します（メモも消えます）";return}
    track("undo",shops().all.find(x=>x.id===openId));delete S.progress.stamps[openId];await saveProgress();
    if(arrive?.id===openId)arrive=null;openId=null;renderArrive();renderPlay();renderSheet();return}
  if(t.id==="arrive-close"){arrive=null;renderArrive();return}
  if(t.dataset.rate){S.progress.stamps[openId].rating=+t.dataset.rate;saveProgress();renderPlay();trackNote(openId,1500);
    document.querySelectorAll("#rate button").forEach(b=>b.classList.toggle("on",+b.dataset.rate<=+t.dataset.rate));return}
  if(t.dataset.roast){draft.roast=draft.roast===t.dataset.roast?"":t.dataset.roast;t.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.roast===draft.roast));return}
  if(t.dataset.taste){const x=t.dataset.taste;draft.tastes=draft.tastes.includes(x)?draft.tastes.filter(y=>y!==x):[...draft.tastes,x];t.classList.toggle("on");return}
  if(t.id==="save-memo"){Object.assign(S.progress.stamps[openId],{memo:$("#memo").value.slice(0,80),bean:$("#n-bean").value.trim().slice(0,30),roast:draft.roast,tastes:draft.tastes});await saveProgress();renderPlay();trackNote(openId);$("#memo-msg").textContent="保存しました";$("#memo-msg").className="msg ok";return}
  if(t.id==="make-img1"||t.id==="make-img2"){await makeImage(+t.id.slice(-1));return}
  if(t.id==="make-img3"||t.id==="make-img4"){const n=+t.id.slice(-1);S.progress.certName=$("#cert-name"+n).value.trim().slice(0,16);await saveProgress();await makeCert(n);return}
  if(/^save-img[1-4]$/.test(t.id)){await saveImage(+t.id.slice(-1));return}
  if(t.id==="del-photo"){delete S.progress.stamps[openId].photo;await saveProgress();renderSheet();return}
});

/* ---------- QR arrival: the shop's QR opens this page with #q-<code> ---------- */
let arrive=null, pendingCode=null, loaded={cfg:false,vendors:false,progress:false};
function parseHash(){const m=(location.hash||"").match(/^#q-([A-Za-z0-9]+)(?:-([0-9a-fA-F]+))?$/);return m?{code:m[1].toUpperCase(),name:m[2]?unhexName(m[2]).slice(0,30):""}:null}
function ready(){return !S.remote||(loaded.cfg&&loaded.vendors&&loaded.progress)}
function tryArrive(){
  if(!pendingCode||!ready())return;
  const {code,name}=pendingCode;pendingCode=null;
  let s=shops().all.find(x=>String(x.code||"").toUpperCase()===code);
  if(!s&&name){S.progress.extra={...(S.progress.extra||{}),[code]:{shop:name}};s=shops().all.find(x=>x.code===code)}
  if(!s){arrive={error:true}}
  else{
    const again=!!S.progress.stamps[s.id];
    if(!again){S.progress.stamps[s.id]={at:nowLabel(),rating:0,memo:""};justGot=s.id;saveProgress();track("stamp",s);trackMilestones()}
    arrive={id:s.id,again};openId=s.id;
  }
  show("play");$("#play-arrive")?.scrollIntoView({block:"start"});
}
function renderArrive(){
  const box=$("#play-arrive");if(!box)return;
  if(!arrive){box.hidden=true;box.innerHTML="";return}
  box.hidden=false;
  if(arrive.error){box.innerHTML=`<h3>このQRのお店は台紙に載っていません</h3><p class="msg">主催者に台紙の内容を確かめてください。</p><button class="btn ghost" id="arrive-close">閉じる</button>`;return}
  const s=shops().all.find(x=>x.id===arrive.id);if(!s){box.hidden=true;return}
  box.innerHTML=`<div class="eyebrow">${arrive.again?"スタンプ済みです":"STAMP GET!"}</div>
    <img class="big" src="${logoOf(s)}" alt="${esc(s.shop)}のロゴ">
    <h3>${esc(s.shop.replace(/^見本：/,""))}</h3>
    <p class="msg">${arrive.again?"このお店のスタンプはもう台紙に載っています。":"ロゴのスタンプを台紙に載せました。下で好みの星をつけられます。"}</p>
    <p class="msg ok">${(()=>{const {list,all}=shops();const k=list.length,t=all.length;return k>=t?`全${t}店舗制覇！`:k===GOAL&&!arrive.again?`${GOAL}店舗 飲み比べ達成！${t>GOAL?"2枚目の「全店制覇」台紙が開きました。":""}`:`${k} / ${t} 店舗`})()}</p>
    <button class="btn ghost" id="arrive-close">台紙を見る</button>`;
}
window.addEventListener("hashchange",()=>{const c=parseHash();if(c){pendingCode=c;tryArrive()}});

const lastBlobs={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}

// which=1: the 5-shop card; which=2: the 全店制覇 card. The overview (1350px) is followed by one tasting-note page per collected shop
async function makeImage(which){
  try{await document.fonts.ready}catch(e){}
  const sh=shops(), all=sh.all, list=which===1?sh.list.slice(0,GOAL):sh.list;

  const g=c.getContext("2d");
  const ink="#2a201b",roast="#5b3a28",stamp="#9a3a1c",leaf="#2e6b5a",muted="#7a6c62",paper="#faf7f3",line="#e2d9cf";
  const D='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif', B='"Noto Sans JP","Hiragino Sans",sans-serif';
  g.fillStyle=paper;g.fillRect(0,0,W,H);
  g.strokeStyle=line;g.lineWidth=4;g.strokeRect(40,40,W-80,TOP-80);
  g.textAlign="center";g.fillStyle=leaf;g.font=`700 26px ${B}`;g.fillText(which===1?"MY COFFEE COLLECTION":"ALL SHOPS CHALLENGE",W/2,130);
  g.fillStyle=roast;g.font=`900 56px ${D}`;fitText(g,S.cfg.title,W/2,205,W-160);
  g.fillStyle=muted;g.font=`500 28px ${B}`;fitText(g,`${S.cfg.date} ／ ${S.cfg.place}`,W/2,255,W-160);
  const k=list.length, total=all.length;
  // Card 1: large 3+2 layout with empty circles for the rest; card 2: every shop in a 4-column grid
  const big=which===1, cols=big?3:4, R=big?110:78;
  const slots=big?[...list,...Array(Math.max(0,GOAL-k)).fill(null)]:[...list,...all.filter(s=>!S.progress.stamps[s.id])];
  const rows=Math.ceil(slots.length/cols), top=big?440:400, rowH=big?375:(rows>2?250:300);
  const pos=slots.map((_,i)=>{const r=Math.floor(i/cols), inRow=Math.min(cols,slots.length-r*cols), gap=big?310:240;
    return [W/2+(i%cols-(inRow-1)/2)*gap, top+r*rowH]});
  for(let i=0;i<slots.length;i++){
    const [x,y]=pos[i], s=slots[i], st=s&&S.progress.stamps[s.id];
    g.save();g.beginPath();g.arc(x,y,R,0,Math.PI*2);g.fillStyle="#efe8e0";g.fill();
    const img=st?await loadImg(logoOf(s)):null;
    if(img&&st){g.clip();const sc=Math.max(2*R/img.width,2*R/img.height);g.drawImage(img,x-img.width*sc/2,y-img.height*sc/2,img.width*sc,img.height*sc)}
    g.restore();
    g.setLineDash(st?[]:[12,10]);g.lineWidth=4;g.strokeStyle=st?line:line;g.beginPath();g.arc(x,y,R,0,Math.PI*2);g.stroke();g.setLineDash([]);
    if(!st){g.fillStyle=muted;g.font=`700 26px ${B}`;g.fillText("？",x,y+9)}
    const tw=big?290:225;
    g.fillStyle=st?ink:muted;g.font=`700 ${big?28:24}px ${B}`;fitText(g,s?s.shop.replace(/^見本：/,""):"―",x,y+R+(big?44:36),tw);
    if(big){
      g.font=`500 21px ${B}`;g.fillStyle=muted;fitText(g,st?[st.bean,st.roast].filter(Boolean).join("・"):"",x,y+R+74,tw);
      g.fillStyle=leaf;g.font=`700 20px ${B}`;fitText(g,st&&st.tastes?.length?st.tastes.join(" ・ "):"",x,y+R+104,tw);
      if(st&&st.rating){g.fillStyle=stamp;g.font=`26px ${B}`;g.fillText(stars(st.rating),x,y+R+136)}
    }else{
      g.font=`500 19px ${B}`;g.fillStyle=muted;fitText(g,st?.roast||"",x,y+R+62,tw);
      if(st&&st.rating){g.fillStyle=stamp;g.font=`22px ${B}`;g.fillText(stars(st.rating),x,y+R+90)}
    }
  }
  // favourite
  const rated=list.filter(s=>S.progress.stamps[s.id]?.rating).sort((a,b)=>S.progress.stamps[b.id].rating-S.progress.stamps[a.id].rating);
  g.fillStyle=roast;g.font=`900 64px ${D}`;g.fillText(which===1?(k>=GOAL?`${GOAL}店舗 飲み比べ達成！`:`${k} / ${GOAL} 杯`):(k>=total?`全${total}店舗制覇！`:`${k} / ${total} 店舗`),W/2,1170);
  g.fillStyle=ink;g.font=`500 28px ${B}`;
  const fav=rated[0];
  fitText(g,fav?`いちばん好きだったのは ${fav.shop.replace(/^見本：/,"")}${S.progress.stamps[fav.id].memo?"「"+S.progress.stamps[fav.id].memo+"」":""}`:"星をつけると、お気に入りがここに入ります",W/2,1228,W-160);
  const d=new Date();g.fillStyle=muted;g.font=`500 20px ${B}`;g.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} 作成`,W/2,1275);
  // Separate images: the card, then the notes for shops 1-5, then (card 2) shops 6 and up

  <div class="panel"><h3>テスト用</h3><div class="row"><button class="btn ghost" id="reset-stamps">自分のスタンプを消す</button></div><p class="msg" id="r-msg"></p></div>`;
  renderAdminApps();
}
function renderQRs(){
  const box=$("#qr-list");if(!box)return;
  const {all:list}=shops();
  box.innerHTML=list.map(s=>`<div class="qr" data-qr="${s.id}"><div class="qr-holder"></div><span class="t">${esc(s.shop)}</span>
    <div class="row" style="justify-content:center"><button class="btn" data-saveqr="${s.id}">QRを保存</button><button class="btn ghost" data-tryqr="${s.id}">読んだことにする</button></div></div>`).join("");
  for(const s of list){
    const el=box.querySelector(`[data-qr="${s.id}"] .qr-holder`);
    if(window.QRCode)new QRCode(el,{text:stampURL(s),width:300,height:300,correctLevel:QRCode.CorrectLevel.M});
    else el.textContent=stampURL(s);
  }
}
async function qrCard(s){
  const src=$(`[data-qr="${s.id}"] canvas`);if(!src)return null;
  const c=document.createElement("canvas");c.width=800;c.height=1000;const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,800,1000);g.textAlign="center";
  g.fillStyle="#5b3a28";g.font='900 46px "Zen Maru Gothic",sans-serif';fitText(g,S.cfg.title,400,100,720);
  g.fillStyle="#2a201b";g.font='700 40px "Noto Sans JP",sans-serif';fitText(g,s.shop.replace(/^見本：/,""),400,170,720);
  g.imageSmoothingEnabled=false;g.drawImage(src,160,220,480,480);
  g.fillStyle="#9a3a1c";g.font='700 34px "Noto Sans JP",sans-serif';g.fillText("スマホのカメラで読み取ってスタンプGET",400,790);
  g.fillStyle="#6e625a";g.font='500 24px "Noto Sans JP",sans-serif';g.fillText("コーヒー飲み比べスタンプラリー",400,850);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
function renderAdminApps(){
  const box=$("#admin-apps");if(!box)return;
  const ap=S.cfg.approved||[];
  $("#ap-count").textContent=`掲載 ${ap.length} / ${SHOP_MAX}`;
  const list=Object.entries(S.vendors).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
  renderQRs();
  box.innerHTML=list.length?list.map(([id,v])=>{const on=ap.includes(id);return`
    <div class="app"><img class="ph" src="${logoOf(v)}" alt="">
    <div class="body"><div class="row" style="justify-content:space-between"><input class="name-in" type="text" id="name-${id}" data-name="${id}" value="${esc(v.shop)}" aria-label="店名" style="flex:1 1 140px;min-width:0">${on?`<span class="tag ok">枠 ${ap.indexOf(id)+1}</span>`:""}</div>
    <div class="row">${on?`<button class="btn ghost" data-unapprove="${id}">掲載をやめる</button>`:`<button class="btn leaf" data-approve="${id}" ${ap.length>=SHOP_MAX?"disabled":""}>掲載する</button>`}
      <label class="file">ロゴ<input type="file" accept="image/*" data-photo="${id}"></label>
      <button class="btn ghost" data-remove="${id}">リストから消す</button></div></div></div>`}).join("")
    :`<p class="msg">まだ取り込まれた申込者はいません。STEP 1で取り込んでください。</p>`;
}
async function importRows(rows){
  if(!rows.length){$("#imp-msg").textContent="取り込める行がありませんでした。1列目に店名が入っているか確かめてください。";$("#imp-msg").className="msg err";return}
  const have=new Set(Object.values(S.vendors).map(v=>v.shop));let added=0,skipped=0;const t=Date.now();
  for(const [i,r] of rows.entries()){
    if(have.has(r.shop)){skipped++;continue}
    have.add(r.shop);added++;
    await saveVendor("v"+(t+i).toString(36)+Math.random().toString(36).slice(2,5),{...r,code:newCode(),image:null,createdAt:t+i});
  }
  $("#imp-text").value="";
  $("#imp-msg").textContent=`${added}店舗を取り込みました${skipped?`（同じ店名の${skipped}件は飛ばしました）`:""}。`;$("#imp-msg").className="msg ok";
  renderAdminApps();
}
const vad=$("#view-admin");
vad.addEventListener("click",async e=>{
  const t=e.target, ap=S.cfg.approved||[];
  if(t.id==="c-save"){await saveCfg({...S.cfg,title:$("#c-title").value.trim()||DEFAULT_CFG.title,date:$("#c-date").value.trim(),place:$("#c-place").value.trim()});
    $("#c-msg").textContent="保存しました";$("#c-msg").className="msg ok"}
  else if(t.id==="imp-go")await importRows(parseList($("#imp-text").value));
  else if(t.dataset.approve&&ap.length<SHOP_MAX){await saveCfg({...S.cfg,approved:[...ap,t.dataset.approve]});renderAdminApps()}
  else if(t.dataset.unapprove){await saveCfg({...S.cfg,approved:ap.filter(x=>x!==t.dataset.unapprove)});renderAdminApps()}
  else if(t.dataset.remove){
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="もう一度押すと消します";return}
    const id=t.dataset.remove;if(ap.includes(id))await saveCfg({...S.cfg,approved:ap.filter(x=>x!==id)});await deleteVendor(id);renderAdminApps()}
  else if(t.dataset.tryqr){const s=shops().all.find(x=>x.id===t.dataset.tryqr);pendingCode={code:String(s.code).toUpperCase(),name:""};tryArrive()}
  else if(t.dataset.saveqr){const s=shops().all.find(x=>x.id===t.dataset.saveqr);const blob=await qrCard(s);
    if(blob&&window.__dl){try{await window.__dl.save({filename:`QR-${s.shop.replace(/^見本：/,"").replace(/[\\/:*?"<>|]/g,"")}.png`,data:blob})}catch(e){}}
    else{t.textContent="長押しで保存";const im=$(`[data-qr="${s.id}"] img`);if(im)im.style.display="block"}}
  else if(t.id==="reset-stamps"){S.progress={stamps:{}};await saveProgress();$("#r-msg").textContent="スタンプを消しました。";$("#r-msg").className="msg ok"}
});
vad.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.name){const v=t.value.trim();if(v&&v!==S.vendors[t.dataset.name]?.shop){await saveVendor(t.dataset.name,{...S.vendors[t.dataset.name],shop:v.slice(0,24)});renderQRs()}return}
  if(!t.files||!t.files[0])return;
  if(t.id==="imp-file"){const r=new FileReader();r.onload=()=>importRows(parseList(String(r.result).replace(/^﻿/,"")));r.readAsText(t.files[0]);t.value=""}
  else if(t.dataset.photo){const id=t.dataset.photo;readImage(t.files[0],320,async u=>{await saveVendor(id,{...S.vendors[id],image:u});renderAdminApps()})}
});

/* ---------- shared helpers ---------- */
function readImage(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};img.src=r.result};
  r.readAsDataURL(file);
}
function flash(t,cls){const n=$("#mode-note");n.hidden=false;n.textContent=t;n.className="note msg "+(cls||"")}

/* ---------- tabs ---------- */
let tab="play";
function show(which){
  tab=which;
  for(const k of ["play","admin"]){$("#tab-"+k).setAttribute("aria-selected",k===which);$("#view-"+k).hidden=k!==which}
  ({play:viewPlay,admin:viewAdmin})[which]();
}
$("#tab-play").onclick=()=>{openId=null;show("play")};
$("#tab-admin").onclick=()=>show("admin");
function onData(kind){
  if(tab==="play"){renderArrive();renderPlay();if(kind!=="progress")renderSheet()}
  else if(tab==="admin")renderAdminApps();
}

/* ---------- in-page QR scanner (camera, or a photo as fallback) ---------- */
let scanStream=null, scanTimer=null;
const scanCanvas=document.createElement("canvas"), scanCtx=scanCanvas.getContext("2d",{willReadFrequently:true});
function handleScanned(text){
  const m=String(text).match(/#q-([A-Za-z0-9]+)(?:-([0-9a-fA-F]+))?/);
  if(!m){$("#scan-msg").textContent="このQRコードはスタンプ用ではないようです。お店のQRコードを写してください。";return false}
  closeScanner();
  pendingCode={code:m[1].toUpperCase(),name:m[2]?unhexName(m[2]).slice(0,30):""};tryArrive();
  return true;
}
function decodeFrom(source,w,h){
  const k=Math.min(1,800/Math.max(w,h));scanCanvas.width=Math.round(w*k);scanCanvas.height=Math.round(h*k);
  scanCtx.drawImage(source,0,0,scanCanvas.width,scanCanvas.height);
  const d=scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height);
  const r=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:"dontInvert"});
  return r&&r.data;
}
async function openScanner(){
  $("#scanner").hidden=false;$("#scan-msg").textContent="カメラの使用を許可してください。";
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=$("#scan-video");v.srcObject=scanStream;await v.play();
    $("#scan-msg").textContent="読み取り中…";
    const tick=()=>{
      if(!scanStream)return;
      if(v.readyState>=2){const t=decodeFrom(v,v.videoWidth,v.videoHeight);if(t&&handleScanned(t))return}
      scanTimer=setTimeout(tick,200);
    };tick();
  }catch(e){$("#scan-msg").textContent="カメラが使えませんでした。「写真から読み込む」でQRコードを撮影してください。"}
}
function closeScanner(){
  clearTimeout(scanTimer);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  $("#scan-video").srcObject=null;$("#scanner").hidden=true;
}
$("#scan-close").addEventListener("click",closeScanner);
$("#scan-file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{const t=decodeFrom(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(img.src);
    if(!t)$("#scan-msg").textContent="QRコードが見つかりませんでした。QRコードが大きく写るように撮り直してください。";else handleScanned(t)};
  img.src=URL.createObjectURL(f);e.target.value="";
});
document.addEventListener("click",e=>{if(e.target.id==="scan-open"||e.target.closest("[data-scan]"))openScanner()});

/* ---------- in-app browser warning (QR apps, LINE, Instagram, Google app...) ---------- */
if(/Line\/|FBAN|FBAV|Instagram|MicroMessenger|KAKAOTALK|GSA\/|YJApp/i.test(navigator.userAgent))$("#inapp").hidden=false;
$("#copy-link").addEventListener("click",async()=>{
  const url=ARTIFACT_URL+(location.hash||"");
  try{await navigator.clipboard.writeText(url);$("#copy-msg").textContent="コピーしました。ブラウザに貼り付けて開いてください。"}
  catch(e){$("#copy-msg").textContent=url}
});

/* ---------- boot ---------- */
lload();
{const pp=pload();if(pp)S.progress=mergeProgress(S.progress,pp)}
pendingCode=parseHash();
$("#tab-admin").hidden=location.hash!=="#admin";
if(location.hash!=="#admin")track("open",null,true);flush();
show("play");
(async()=>{
  const [dbNs,user,dl]=await Promise.all(["db","user","downloads"].map(n=>(window.claude?.use?window.claude.use(n):Promise.resolve(null)).catch(()=>null)));
  window.__dl=dl||{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return{status:"saved"}}};
  const uid=user?await user.id().catch(()=>null):null;
  if(!dbNs||!uid){
    tryArrive();return;
  }
  db=dbNs;S.uid=uid;S.remote=true;S.canEdit=await user.canEdit().catch(()=>false);
  S.vendors={};S.cfg={...DEFAULT_CFG};S.progress=pload()||{stamps:{}};S.cloudOK=false;
  $("#tab-admin").hidden=!S.canEdit;
  if(!S.canEdit&&tab==="admin")show("play");
  progressRef=db.doc(`data/users/${uid}/progress`);
  db.doc("config/event").onSnapshot(s=>{S.cfg={...DEFAULT_CFG,...(s.exists?s.data():{})};loaded.cfg=true;onData("cfg");tryArrive()},e=>flash("イベント情報を読み込めませんでした","err"));
  db.collection("vendors").onSnapshot(q=>{const v={};q.docs.forEach(d=>v[d.id]=d.data());S.vendors=v;loaded.vendors=true;onData("vendors");tryArrive()},e=>flash("コーヒーショップの情報を読み込めませんでした","err"));
  let firstProgress=true;
  progressRef.onSnapshot(s=>{
    const remote=s.exists?{stamps:{},...s.data()}:{stamps:{}};
    if(firstProgress){
      firstProgress=false;
      // Keep stamps collected on this phone before the account copy loaded
      const merged=mergeProgress(pload()||{stamps:{}},remote);
      S.progress=merged;
      if(JSON.stringify(merged)!==JSON.stringify(remote))saveProgress();else{S.cloudOK=s.exists;psave()}
    }else{S.progress=mergeProgress(S.progress,remote);psave()}
    loaded.progress=true;onData("progress");tryArrive()
  },()=>{loaded.progress=true;tryArrive()});
  if(tab!=="play")show(tab);
})();
</script>
